# SELECTION RUN — Alberto directive 2026-08-07 (TG 12234/12235): run on the data WE HAVE (corpus
# as-of 2026-07-13); the freshly caught-up weeks (07-14..08-05) become genuinely-untouched OOS
# validation once the incremental catch-up lands. Levers per the LOCKED decision
# projects/quant/decisions/2026-08-06-selection-principles-and-dials-locked.
# m07 runs the LIVE-PARITY configuration (codex-approved 2026-08-06) so the selection statistic is
# measured on the replica we will actually trade.
# HARD gates not yet knobbed in m06b (two-sidedness, uw-add/closure/liq components, latency-ratio,
# lifetime-PnL API check) run as a POST-m06b filter on the confirmed set, named in provenance,
# per the locked decision's transition clause.

name: parity_census_asof0713
description: >-
  Full-census selection on the as-of-2026-07-13 canonical corpus under live-parity m07 semantics
  and the 2026-08-06 locked dials (permissive statistical tier). Wallet-only fold-pure M04 view.
  Fresh 07-14..08-05 data reserved as untouched OOS validation.

inputs:
  actions: app/data/v15/census20k_20260728/m02_actions.parquet
  journeys: app/data/v15/census20k_20260728/m02_journeys.parquet
  folds: app/data/v15/folds12_20260730/m03_folds.parquet
  m04_dir: app/data/v15/entity_resolution_views_20260803/wallet_only
  m03_activity: app/data/v15/folds12_20260730/m03_wallet_activity_summary.parquet
  slip_calib: app/data/v15/census20k_20260728/slippage_calib.json
  action_shards: research/app/data/v15/m07_shard_cache/7e2f7c71be389d0e2928a83590ed2bdcd8d4840d704c8944d33bf74bb116e184

output:
  dir: app/data/v15/experiments/parity_census_asof0713

m05:
  mode: copyability

m06a:
  manifest: config/experiments/m06a_manifest_full_census.json

m07:
  windows: [pretest, test]
  workers: 1
  sizing_mode: fixed_notional
  fixed_notional_usd: 100.0
  # inert under fixed_notional; present because the runner dereferences it unguarded under set -u
  # (bit us 2026-08-07 10:39 — add a :- default to experiment.sh's m07 block on its next touch)
  fixed_target_exposure: 0.10
  reversal_mode: flatten_only
  exit_latency_ms: 30000
  exit_entry_grace_ms: 90000
  leader_dust_floor_usd: 10.0
  sl_bps: -2500.0
  global_stop_pct: 0.15
  copy_policy: full_mirror
  copy_latency_ms: 4000
  start_equity: 452.96

m06b:
  w_pp_mean_r: 0.45
  w_pp_t: 0.15
  w_pp_std: 0.05
  w_pp_mtm_dd: 0.20
  w_pp_quick: 0.15
  pp_min_positions: 25
  fdr_q: 0.20
  oos_min_folds: 3
  oos_min_journeys_pooled: 50
  oos_min_frac_folds_pos: 0.50
  fee_schedule_version: hl_fee_schedule_2026-06-01
  slippage_calibration_version: v11-fills-v2

m09:
  b0: 452.96
  target_count: 20
  rho_max: 0.70
  gross_cap: 5.0
  global_dd_derisk: 0.15
  g4_intrafold_kill: 0.15
  per_entity_cap: 0.15
  suspicious_cohort_cap: 0.10
  min_order_notional: 10.0
  min_accessible_frac: 0.80
  sizing_mode: fixed_notional
  fixed_notional_usd: 100.0

m10:
  n_null_dev: 1000
  workers: 2
  gate_percentile: 95
  expected_n_folds: 12
  min_positive_folds: 8
  g1_chained_roe: 0.8928340679571876

oos:
  tool: forward_oos_hot
  mark_source: candles
  allow_unverified_marks: false
  min_trades: 5
  windows:
    - 2026-07-13
    - 2026-07-20
    - 2026-07-27

resources:
  mem_safe_floor_gb: 2
